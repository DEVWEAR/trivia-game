name: Import World Cup 300 bilingual questions
on:
  push:
    paths:
      - 'tool/imports/world_cup_question_bank_300_fixed.xlsx'
      - 'tool/generate_world_cup.py'
      - '.github/workflows/generate-world-cup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python tool/generate_world_cup.py
      - name: Publish category after successful generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/data/playable_category_registry.dart')
          s=p.read_text()
          imp="import 'questions/world_cup_questions.dart';"
          card="  PlayableCategory('world_cup', '🏆🌍', 'كأس العالم', 'FIFA World Cup', worldCupQuestions),"
          if imp not in s:s=imp+'\n'+s
          if card not in s:s=s.replace('final playableCategories = <PlayableCategory>[','final playableCategories = <PlayableCategory>[\n'+card)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/questions/world_cup_questions.dart lib/data/playable_category_registry.dart tool/imports/world_cup_en_cache.json
          git diff --cached --quiet || (git commit -m 'Publish 300 bilingual World Cup questions' && (git pull --rebase origin main && git push origin HEAD:main))
