name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uploaded bright-sun clue as local asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/two_pics
          test -s '001_1.jpg.jpeg'
          cp '001_1.jpg.jpeg' assets/two_pics/001_2.jpg
          file assets/two_pics/001_1.jpg assets/two_pics/001_2.jpg
          test $(wc -c < assets/two_pics/001_1.jpg) -gt 10000
          test $(wc -c < assets/two_pics/001_2.jpg) -gt 10000
          if ! git diff --quiet -- assets/two_pics/001_2.jpg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/two_pics/001_2.jpg
            git commit -m 'Replace sun clue with uploaded bright sky photo'
            git push origin HEAD:main
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /trivia-game/
      - name: Verify Two Pics assets are in published output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test $(wc -c < build/web/assets/assets/two_pics/001_1.jpg) -gt 10000
          test $(wc -c < build/web/assets/assets/two_pics/001_2.jpg) -gt 10000
          file build/web/assets/assets/two_pics/001_1.jpg build/web/assets/assets/two_pics/001_2.jpg
          echo 'Updated Two Pics assets verified inside Flutter build'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
