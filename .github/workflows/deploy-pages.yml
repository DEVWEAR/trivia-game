name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Verified Pages base path, including leading/trailing slash'
        default: '/trivia-game/'
        required: true
        type: string
      publish:
        description: 'Publish after all release checks pass'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release inputs and dependency lock
        shell: bash
        env:
          BASE_HREF: ${{ inputs.base_href || '/trivia-game/' }}
        run: |
          set -euo pipefail
          [[ "$BASE_HREF" =~ ^/([A-Za-z0-9_-]+/)*$ ]]
          test -s pubspec.lock
          node tool/validate_two_pics_redesign.js

      - name: Verify protected completed banks and audit evidence
        shell: pwsh
        run: ./tool/verify_release_hashes.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: dart run test/question_history_test.dart
      - run: dart run test/question_bank_validation_test.dart
      - run: dart run tool/validate_release.dart
      - run: dart run tool/audit_two_pics_runtime.dart
      - run: node tool/validate_two_pics_redesign.js
      - run: node tool/validate_two_pics_concepts.js
      - run: flutter test test/deployment_smoke_test.dart
      - name: Build fresh web output
        env:
          BASE_HREF: ${{ inputs.base_href || '/trivia-game/' }}
        run: flutter build web --release --base-href "$BASE_HREF"

      - name: Avoid stale cached Flutter assets
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -f build/web/flutter_service_worker.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          index = Path('build/web/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('src="flutter_bootstrap.js"', 'src="flutter_bootstrap.js?v=' + os.environ['RELEASE_SHA'] + '"')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Stamp release identity
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '{"commit":"%s","certifiedCategories":23,"certifiedQuestions":4692,"flutter":"3.47.6"}\n' "$RELEASE_SHA" > build/web/release.json

      - name: Verify Two Pics assets in published output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          node tool/validate_two_pics_redesign.js --build

      - uses: actions/upload-artifact@v4
        with:
          name: preview-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
          retention-days: 90

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
