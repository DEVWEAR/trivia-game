name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bundle real Two Pics photos from Wikimedia Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/two_pics
          python3 - <<'PY'
          import json, pathlib, re, time, urllib.parse, urllib.request

          files=sorted(pathlib.Path('lib/data/questions').glob('two_pics_questions_*.dart'))
          pattern=re.compile(r"_p(?:200|400|600)\('two_pics_(\d+)'\s*,\s*'[^']*'\s*,\s*'[^']*'\s*,\s*'([^']+)'\s*,\s*'([^']+)'\)")
          clues=[]
          for f in files:
              text=f.read_text(encoding='utf-8')
              clues.extend((int(m.group(1)),m.group(2),m.group(3)) for m in pattern.finditer(text))
          if len(clues)!=102:
              raise SystemExit(f'Expected 102 Two Pics questions, found {len(clues)}')

          headers={'User-Agent':'DEVTriviaGame/1.0 (GitHub Pages build)','Accept':'application/json'}
          def get_json(params):
              url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:
                  return json.load(r)

          def find_photo(term):
              data=get_json({'action':'query','generator':'search','gsrsearch':term+' filetype:bitmap','gsrnamespace':'6','gsrlimit':'8','prop':'imageinfo','iiprop':'url|mime','iiurlwidth':'960','format':'json','origin':'*'})
              pages=list(data.get('query',{}).get('pages',{}).values())
              for p in sorted(pages,key=lambda x:x.get('index',999)):
                  info=(p.get('imageinfo') or [{}])[0]
                  mime=info.get('mime','')
                  url=info.get('thumburl') or info.get('url')
                  if url and mime.startswith('image/') and mime not in ('image/svg+xml','image/gif'):
                      return url
              raise RuntimeError('No usable Commons photo for '+term)

          def download(term,out):
              last=None
              for attempt in range(5):
                  try:
                      url=find_photo(term)
                      req=urllib.request.Request(url,headers={'User-Agent':headers['User-Agent'],'Accept':'image/*'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          data=r.read(); ctype=r.headers.get('Content-Type','')
                      if len(data)>3000 and ctype.startswith('image/'):
                          out.write_bytes(data); return
                      last=RuntimeError(f'bad image {ctype} {len(data)}')
                  except Exception as e:
                      last=e; time.sleep(2+attempt)
              raise last

          for n,a,b in clues:
              for side,term in ((1,a),(2,b)):
                  out=pathlib.Path(f'web/two_pics/{n:03d}_{side}.jpg')
                  download(term,out)
                  print('saved',out,term,out.stat().st_size)
          print('Bundled',len(clues)*2,'real clue photos')
          PY
      - run: flutter build web --release --base-href /trivia-game/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
