name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare Two Pics folder without network dependency
        run: mkdir -p web/two_pics
      - run: flutter build web --release --base-href /trivia-game/
      - name: Verify Flutter web output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          echo "Flutter web output verified"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
