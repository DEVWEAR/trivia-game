name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Download two-pics photos into same-origin web assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/two_pics
          python3 - <<'PY'
          import pathlib, re, urllib.parse, urllib.request, time
          files = sorted(pathlib.Path('lib/data/questions').glob('two_pics_questions_*.dart'))
          pat = re.compile(r"_p(?:200|400|600)\('two_pics_(\d+)'\s*,\s*'[^']*'\s*,\s*'[^']*'\s*,\s*'([^']+)'\s*,\s*'([^']+)'\)")
          items=[]
          for f in files:
              for m in pat.finditer(f.read_text(encoding='utf-8')):
                  items.append((int(m.group(1)), m.group(2), m.group(3)))
          if not items:
              raise SystemExit('No two-pics questions found')
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','Mozilla/5.0')]
          for n,a,b in items:
              for side,brief in enumerate((a,b),1):
                  out=pathlib.Path(f'web/two_pics/{n:03d}_{side}.jpg')
                  origin='https://loremflickr.com/960/720/'+urllib.parse.quote(brief,safe='')+f'?lock={n*2+side}'
                  encoded=urllib.parse.quote(origin,safe='')
                  url=f'https://images.weserv.nl/?url={encoded}&w=960&h=720&fit=cover&output=jpg'
                  ok=False
                  for attempt in range(4):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})
                          with opener.open(req,timeout=45) as r:
                              data=r.read()
                              ctype=r.headers.get('Content-Type','')
                          if len(data)>5000 and ctype.startswith('image/'):
                              out.write_bytes(data); ok=True; break
                          print('invalid image',n,side,len(data),ctype)
                      except Exception as e:
                          print('retry',n,side,attempt+1,e)
                          time.sleep(2)
                  if not ok:
                      raise SystemExit(f'Failed photo {n}_{side}: {url}')
          print(f'Downloaded {len(items)*2} clue photos')
          PY
      - run: flutter build web --release --base-href /trivia-game/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
