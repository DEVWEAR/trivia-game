name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IMPORTANT: clue images are curated repository assets.
      # Deployment must never replace them with unreviewed search results.
      - name: Verify curated Two Pics local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/two_pics

          # Preserve the manually supplied first clue image under the filename
          # expected by the game if it has not been normalized yet.
          if [ ! -s assets/two_pics/001_1.jpg ] && [ -s '001_1.jpg.jpeg' ]; then
            cp '001_1.jpg.jpeg' assets/two_pics/001_1.jpg
          fi

          missing=0
          for i in $(seq -f '%03g' 1 68); do
            for side in 1 2; do
              f="assets/two_pics/${i}_${side}.jpg"
              if [ ! -s "$f" ]; then
                echo "MISSING: $f"
                missing=1
              fi
            done
          done

          if [ "$missing" -ne 0 ]; then
            echo 'Curated Two Pics assets are incomplete. Refusing to substitute random web-search images.'
            exit 1
          fi
          echo 'All 136 curated clue assets are present.'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /trivia-game/

      - name: Verify Two Pics assets in published output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          for i in $(seq -f '%03g' 1 68); do
            test -s "build/web/assets/assets/two_pics/${i}_1.jpg"
            test -s "build/web/assets/assets/two_pics/${i}_2.jpg"
          done
          echo 'All 136 curated clue images are bundled in Flutter web.'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
