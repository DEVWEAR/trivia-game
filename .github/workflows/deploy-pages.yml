name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare curated Two Pics 200 local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/two_pics

          # Keep the approved first card exactly as-is: eyeglasses + user's bright sun photo.
          test -s '001_1.jpg.jpeg'
          cp '001_1.jpg.jpeg' assets/two_pics/001_2.jpg

          python3 - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request

          root = pathlib.Path('assets/two_pics')
          manifest = root / '200_clues.tsv'
          UA = 'DEVTriviaGame/1.0 (curated educational image clues)'

          def commons_photo(query):
              params = {
                  'action':'query','format':'json','generator':'search','gsrnamespace':'6',
                  'gsrlimit':'8','gsrsearch':f'{query} filetype:bitmap',
                  'prop':'imageinfo','iiprop':'url|mime','iiurlwidth':'1200'
              }
              url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              pages = list(data.get('query',{}).get('pages',{}).values())
              pages.sort(key=lambda p: p.get('index',9999))
              for p in pages:
                  info = (p.get('imageinfo') or [{}])[0]
                  mime = info.get('mime','')
                  candidate = info.get('thumburl') or info.get('url')
                  if candidate and mime.startswith('image/') and 'svg' not in mime:
                      return candidate
              raise RuntimeError(f'No usable Commons photo for: {query}')

          def download(query, dest):
              url = commons_photo(query)
              req = urllib.request.Request(url, headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=45) as r:
                  body = r.read()
              if len(body) < 8000:
                  raise RuntimeError(f'Image too small for {query}: {len(body)} bytes')
              dest.write_bytes(body)
              print(f'{dest}: {query} -> {len(body)} bytes')
              time.sleep(.15)

          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip() or raw.startswith('#'): continue
              n, q1, q2 = raw.split('\t')
              download(q1, root / f'{n}_1.jpg')
              download(q2, root / f'{n}_2.jpg')
          PY

          # All 34 easy cards must have both local clues and non-trivial files.
          for n in $(seq -w 1 34); do
            test -s "assets/two_pics/0${n}_1.jpg" || test -s "assets/two_pics/${n}_1.jpg"
            test -s "assets/two_pics/0${n}_2.jpg" || test -s "assets/two_pics/${n}_2.jpg"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/two_pics/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add curated local photos for all 200-point Two Pics cards'
            git push origin HEAD:main
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /trivia-game/

      - name: Verify all Two Pics 200 assets in published output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          for i in $(seq -f '%03g' 1 34); do
            test $(wc -c < "build/web/assets/assets/two_pics/${i}_1.jpg") -gt 8000
            test $(wc -c < "build/web/assets/assets/two_pics/${i}_2.jpg") -gt 8000
          done
          echo 'All 68 local clue images for the 34 easy cards are bundled in Flutter web.'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
