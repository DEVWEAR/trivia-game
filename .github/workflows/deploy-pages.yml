name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare curated Two Pics 200 local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/two_pics
          test -s '001_1.jpg.jpeg'
          cp '001_1.jpg.jpeg' assets/two_pics/001_2.jpg

          python3 - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request, urllib.error

          root = pathlib.Path('assets/two_pics')
          manifest = root / '200_clues.tsv'
          UA = 'DEVTriviaGame/1.0 (curated educational image clues; GitHub Actions)'
          last_request = [0.0]

          def polite_open(req, timeout):
              # Wikimedia rate-limits bursts from shared CI IPs. Keep every request
              # spaced apart and honor 429 Retry-After with exponential backoff.
              for attempt in range(7):
                  wait = 1.25 - (time.time() - last_request[0])
                  if wait > 0: time.sleep(wait)
                  try:
                      r = urllib.request.urlopen(req, timeout=timeout)
                      last_request[0] = time.time()
                      return r
                  except urllib.error.HTTPError as e:
                      last_request[0] = time.time()
                      if e.code != 429 or attempt == 6:
                          raise
                      retry = e.headers.get('Retry-After')
                      delay = float(retry) if retry and retry.isdigit() else min(60, 5 * (2 ** attempt))
                      print(f'HTTP 429; cooling down {delay:.0f}s before retry {attempt+2}/7')
                      time.sleep(delay)
              raise RuntimeError('request retry loop exhausted')

          def api_search(query):
              params = {
                  'action':'query','format':'json','generator':'search','gsrnamespace':'6',
                  'gsrlimit':'12','gsrsearch':query,
                  'prop':'imageinfo','iiprop':'url|mime','iiurlwidth':'1000'
              }
              url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':UA})
              with polite_open(req, 30) as r:
                  return json.load(r)

          def commons_photo(query):
              words = query.split()
              attempts = [query]
              if len(words) > 3: attempts.append(' '.join(words[:3]))
              if len(words) > 2: attempts.append(' '.join(words[:2]))
              attempts.append(' '.join(words[-2:]))
              attempts.append(words[0])
              seen = set()
              for q in attempts:
                  if not q or q in seen: continue
                  seen.add(q)
                  data = api_search(q)
                  pages = list(data.get('query',{}).get('pages',{}).values())
                  pages.sort(key=lambda p: p.get('index',9999))
                  for p in pages:
                      info = (p.get('imageinfo') or [{}])[0]
                      mime = info.get('mime','')
                      candidate = info.get('thumburl') or info.get('url')
                      if candidate and mime in ('image/jpeg','image/png','image/webp'):
                          return candidate, q
              raise RuntimeError(f'No usable Commons photo after fallbacks: {query}')

          def download(query, dest):
              # Resume safely if a previous successful run already committed this asset.
              if dest.exists() and dest.stat().st_size > 8000:
                  print(f'KEEP {dest} ({dest.stat().st_size} bytes)')
                  return
              last = None
              for attempt in range(4):
                  try:
                      url, used = commons_photo(query)
                      req = urllib.request.Request(url, headers={'User-Agent':UA})
                      with polite_open(req, 45) as r:
                          body = r.read()
                      if len(body) < 8000:
                          raise RuntimeError(f'image too small: {len(body)}')
                      if body[:2] != b'\xff\xd8' and body[:8] != b'\x89PNG\r\n\x1a\n' and body[:4] != b'RIFF':
                          raise RuntimeError('download is not a recognized raster image')
                      dest.write_bytes(body)
                      print(f'OK {dest}: {query} [search={used}] -> {len(body)} bytes')
                      return
                  except Exception as e:
                      last = e
                      print(f'Retry {attempt+1}/4 for {query}: {e}')
                      time.sleep(min(30, 4 * (attempt + 1)))
              raise RuntimeError(f'FAILED {query}: {last}')

          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip() or raw.startswith('#'): continue
              n, q1, q2 = raw.split('\t')
              download(q1, root / f'{n}_1.jpg')
              download(q2, root / f'{n}_2.jpg')
          PY

          for i in $(seq -f '%03g' 1 34); do
            test $(wc -c < "assets/two_pics/${i}_1.jpg") -gt 8000
            test $(wc -c < "assets/two_pics/${i}_2.jpg") -gt 8000
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/two_pics/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add curated local photos for all 200-point Two Pics cards'
            git push origin HEAD:main
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /trivia-game/

      - name: Verify all Two Pics 200 assets in published output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          for i in $(seq -f '%03g' 1 34); do
            test $(wc -c < "build/web/assets/assets/two_pics/${i}_1.jpg") -gt 8000
            test $(wc -c < "build/web/assets/assets/two_pics/${i}_2.jpg") -gt 8000
          done
          echo 'All 68 local clue images for the 34 easy cards are bundled in Flutter web.'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
