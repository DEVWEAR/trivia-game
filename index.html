<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Sheet - 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#263449;font:14px Calibri,Arial,sans-serif}header{padding:15px 22px;background:#fff;border-bottom:1px solid #cfd5df;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}small{color:#64748b}.warning{padding:10px 20px;background:#fff3d8;color:#76520e;border-bottom:1px solid #e4c78b}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;background:white}button{padding:9px 13px;border:1px solid #bac6d6;background:#fff;border-radius:5px;color:#263449;cursor:pointer}button.primary{background:#163c65;color:white;border-color:#163c65}button.danger{color:#a02738}.bar input{padding:9px;border:1px solid #bac6d6;border-radius:4px;min-width:190px}.sheet{margin:14px;overflow:auto;border:1px solid #b6c2d0;background:white;height:calc(100vh - 265px);min-height:400px}table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}th,td{border-right:1px solid #b6c2d0;border-bottom:1px solid #b6c2d0}thead th{position:sticky;top:0;z-index:2;background:#18253f;color:white;font-size:13px;text-align:center;min-width:145px;max-width:145px;height:100px;padding:8px 5px;white-space:normal;overflow-wrap:anywhere}thead th:nth-child(18),thead th:nth-child(19),thead th:nth-child(24),thead th:nth-child(25),thead th:nth-child(26),thead th:nth-child(27){min-width:260px;max-width:260px}.arabic-heading{font-family:Tahoma,Arial,sans-serif;font-size:12px;line-height:1.5;color:#e0eaf8;margin-top:7px;padding-top:6px;border-top:1px solid #53617b;font-weight:400}thead th{height:128px;min-width:165px;max-width:165px}thead th:first-child{position:sticky;left:0;z-index:4;min-width:52px;max-width:52px;background:#26354b}tbody th{position:sticky;left:0;background:#e9edf3;min-width:52px;max-width:52px;font-weight:400;color:#66758a;z-index:1}tbody td{height:53px;padding:0;background:#fff}tbody tr:nth-child(even) td{background:#f8fafd}td input,td select,td textarea{font:13px Calibri,Arial,sans-serif;width:100%;height:52px;border:0;padding:6px 7px;background:transparent;color:#27364a;outline-offset:-2px}td textarea{resize:none}td input:focus,td select:focus,td textarea:focus{outline:2px solid #4387bd;background:#fff}footer{padding:0 18px 12px;color:#52657d}.tabs{display:flex;gap:2px;margin:0 14px}.tab{padding:8px 16px;background:white;border:1px solid #cbd5e1;border-bottom:3px solid #2c8a64}.hint{margin-left:auto;color:#52657d}@media(max-width:600px){.sheet{height:calc(100vh - 320px)}}
</style></head><body><header><h1>Complaint Sheet - 2026</h1><small>Complaints Log</small></header><div class="bar"><button class="primary" id="add">+ Add row</button><button id="demo">Sample rows</button><button id="copy">Copy selected row</button><button id="export">Export CSV</button><button id="delete">Delete selected row</button><button class="danger" id="clear">Clear all</button><input id="search" placeholder="Find in practice sheet..."><span class="hint" id="msg">Click any cell to edit</span></div><div class="sheet" id="scroller"><table><thead><tr id="head"><th>#</th></tr></thead><tbody id="body"></tbody></table></div><div class="tabs"><span class="tab">Complaints Log</span><span class="tab">Data Validation</span><span class="tab">Handover</span></div><footer>34 columns • Entries are temporary and not saved. Do not enter real patient data.</footer>
<script>
const headers=["Complaint Serial Number","Month","Date of Complaint (mm/dd/yyyy)","Date of Acknowledgement Call (mm/dd/yyyy)","Complainant Name","BH Number","Mobile Number","Responsible_PE_Member","Complaint Source","Complaint Type","Department","Concerned Sub_Department","Category","Complaint_Sub_Category","Complained Against Duty","Complained Against Name","Complaint Severity","Patient complaint","PE Immediate Action","Follow up Needed","Replied By Email","Replied By Investigation Form","Responsible Leader","Department Feedback","Root Cause","Corrective Action","Preventive Action","Hyperlinks in Relation to Complaint Details and Actions","Applicable/ Not applicable","Date Complaint Closed","Clouser Status","TAT Of Clouser","Comment","Remove Google Review"];
const arabicHeaders=["الرقم التسلسلي للشكوى","الشهر","تاريخ تقديم الشكوى (شهر/يوم/سنة)","تاريخ اتصال تأكيد استلام الشكوى (شهر/يوم/سنة)","اسم مقدّم الشكوى","رقم ملف المريض في المستشفى","رقم الهاتف المتحرك","موظف تجربة المرضى المسؤول","مصدر الشكوى","نوع الشكوى","القسم المعني","القسم الفرعي المعني","تصنيف الشكوى","التصنيف الفرعي للشكوى","المسمى الوظيفي للشخص المشكوّ بحقه","اسم الشخص المشكوّ بحقه","درجة خطورة الشكوى","تفاصيل شكوى المريض","الإجراء الفوري من فريق تجربة المرضى","هل تحتاج الشكوى إلى متابعة؟","هل تم الرد عبر البريد الإلكتروني؟","هل تم الرد عبر نموذج التحقيق؟","المسؤول عن القسم","رد القسم المعني","السبب الجذري للمشكلة","الإجراء التصحيحي","الإجراء الوقائي","روابط تفاصيل الشكوى والإجراءات المتعلقة بها","ينطبق / لا ينطبق","تاريخ إغلاق الشكوى","حالة إغلاق الشكوى","المدة المستغرقة لإغلاق الشكوى","ملاحظات","إزالة مراجعة Google"];
const selects={8:["Ticket System","Survey","Verbal","Email","Written"],16:["Low","Medium","High"],19:["Yes","No"],20:["Yes","No"],21:["Yes","No"],28:["Applicable","Not applicable"],30:["Open","In Progress","Closed"],33:["Yes","No","Not applicable"]};
const dates=new Set([2,3,29]);const multiline=new Set([17,18,23,24,25,26,32]);let rows=[],selected=-1;
const body=document.getElementById("body"),head=document.getElementById("head");
headers.forEach((h,i)=>{const th=document.createElement("th");const en=document.createElement("div");en.textContent=h;const ar=document.createElement("div");ar.className="arabic-heading";ar.lang="ar";ar.dir="rtl";ar.textContent=arabicHeaders[i];th.append(en,ar);th.title=h+" — "+arabicHeaders[i];head.append(th)});
const empty=()=>Array(headers.length).fill("");
function render(){body.innerHTML="";const q=document.getElementById("search").value.toLowerCase();rows.forEach((row,r)=>{if(q&&!row.join(" ").toLowerCase().includes(q))return;const tr=document.createElement("tr"),num=document.createElement("th");num.textContent=r+2;num.onclick=()=>choose(r);num.style.background=r===selected?"#c1dff1":"";tr.append(num);row.forEach((value,c)=>{const td=document.createElement("td");let inp;if(selects[c]){inp=document.createElement("select");for(const option of ["",...selects[c]]){const el=document.createElement("option");el.value=option;el.textContent=option;inp.append(el)}}else if(multiline.has(c)){inp=document.createElement("textarea")}else{inp=document.createElement("input");inp.type=dates.has(c)?"date":"text"}inp.value=value;inp.setAttribute("aria-label",headers[c]);inp.addEventListener("focus",()=>choose(r));inp.addEventListener("input",()=>{rows[r][c]=inp.value});td.append(inp);tr.append(td)});body.append(tr)})}
function choose(r){selected=r;document.getElementById("msg").textContent="Selected row "+(r+2)}
document.getElementById("add").onclick=()=>{rows.push(empty());render();document.getElementById("scroller").scrollTop=999999};
document.getElementById("demo").onclick=()=>{rows=[empty(),empty(),empty()];rows[0][0]="TRAIN-0001";rows[0][1]="November";rows[0][4]="Demo Patient A";rows[0][5]="DEMO-1001";rows[0][8]="Survey";rows[0][17]="Fictional waiting-time concern";rows[0][30]="Open";rows[1][0]="TRAIN-0002";rows[1][4]="Demo Patient B";rows[1][8]="Ticket System";rows[2][0]="TRAIN-0003";rows[2][4]="Demo Patient C";render()};
document.getElementById("delete").onclick=()=>{if(selected<0)return alert("Select a row first.");rows.splice(selected,1);selected=-1;render()};
document.getElementById("clear").onclick=()=>{if(confirm("Erase all practice rows?")){rows=[];selected=-1;render()}};
document.getElementById("search").oninput=render;
document.getElementById("copy").onclick=async()=>{if(selected<0)return alert("Select a row first.");try{await navigator.clipboard.writeText(rows[selected].map(x=>x.replace(/[\t\n\r]+/g," ")).join("\t"));alert("Row copied")}catch{alert("Clipboard unavailable")}};
document.getElementById("export").onclick=()=>{const quote=x=>'"'+String(x).replace(/"/g,'""')+'"';const csv=[headers,...rows].map(r=>r.map(quote).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="complaints-sheet.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
rows=Array.from({length:12},empty);render();window.addEventListener("beforeunload",e=>{if(rows.some(r=>r.some(Boolean))){e.preventDefault();e.returnValue=""}});
</script></body></html>
