<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Original Arabic and English social trivia game.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211A20">
  <link rel="preload" as="image" href="assets/83A426BC-6461-4BD6-BB12-7877AED62765.png" fetchpriority="high">
  <style>html,body{margin:0;min-height:100%;background:#211A20}#first-paint{position:fixed;inset:0;background:#211A20 url("assets/83A426BC-6461-4BD6-BB12-7877AED62765.png") center center/cover no-repeat;z-index:1;pointer-events:none}#first-paint:after{content:"";position:absolute;inset:0;background:rgba(27,18,16,.46)}</style>
  <title>Trivia Game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="first-paint" aria-hidden="true"></div>
  <script>
    (function(){
      var flutterReady=false, imageReady=false;
      function removeSplash(){
        if(!flutterReady||!imageReady)return;
        var splash=document.getElementById("first-paint");
        if(splash)splash.remove();
      }
      window.addEventListener("flutter-first-frame",function(){flutterReady=true;removeSplash();},{once:true});
      var img=new Image();
      img.onload=function(){imageReady=true;removeSplash();};
      img.onerror=function(){imageReady=true;removeSplash();};
      img.src="assets/83A426BC-6461-4BD6-BB12-7877AED62765.png";
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
